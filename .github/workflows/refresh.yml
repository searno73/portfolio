name: Refresh Portfolio Data

on:
  schedule:
    - cron: '*/15 * * * *' # S'exécute toutes les 15 minutes
  workflow_dispatch: # Permet de forcer manuellement le rafraîchissement si besoin

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install pandas requests

    - name: Fetch Google Sheet Data
      run: python fetch_data.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "PORTFX-Bot"
        git config --global user.email "bot@portfx.local"
        git add data.json
        git commit -m "MAJ automatique des données" || exit 0
        git push
