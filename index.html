<!DOCTYPE html>
<html lang="fr" class="h-full bg-[#0d1117]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTFX - Portfolio Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="h-full text-[#c9d1d9] flex">

    <aside class="w-64 bg-[#090d12] border-r border-[#21262d] flex flex-col justify-between p-6">
        <div>
            <div class="mb-8">
                <h1 class="text-xl font-bold tracking-wider text-[#a3e635] mono">PORTFX</h1>
                <p class="text-xs text-[#8b949e] tracking-widest uppercase">Portfolio Tracker</p>
            </div>
            
            <nav class="space-y-6">
                <div>
                    <span class="text-xs font-semibold text-[#30363d] uppercase tracking-wider block mb-2">Vue</span>
                    <a href="#" class="flex items-center space-x-2 text-[#a3e635] font-semibold bg-[#161b22] px-3 py-2 rounded-md border-l-4 border-[#a3e635]">
                        <span class="text-sm">◆ Vue d'ensemble</span>
                    </a>
                </div>
            </nav>
        </div>

        <div class="border-t border-[#21262d] pt-4 text-xs space-y-3">
            <div>
                <div class="flex items-center space-x-2 text-[#a3e635]">
                    <span class="animate-pulse">●</span>
                    <span class="font-bold">Live</span>
                </div>
                <p class="text-[#8b949e] mt-1 mono" id="last-update">MAJ: En cours...</p>
            </div>
            <button onclick="location.reload()" class="w-full bg-[#21262d] hover:bg-[#30363d] text-white py-1.5 rounded text-center block transition border border-[#30363d]">
                ⟳ Rafraîchir
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8 space-y-8">
        <div class="flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold tracking-tight text-white">Vue d'ensemble</h2>
                <p class="text-sm text-[#8b949e]">Situation globale de tes actifs financiers</p>
            </div>
        </div>

        <div class="grid grid-cols-1 gap-6">
            <div class="bg-[#161b22] p-6 rounded-xl border border-[#21262d]">
                <h3 class="text-xs font-bold uppercase tracking-wider text-[#8b949e] mb-4">Performance Totale par Ligne (%)</h3>
                <div id="perfChart"></div>
            </div>
        </div>

        <div class="bg-[#161b22] rounded-xl border border-[#21262d] overflow-hidden">
            <div class="px-6 py-4 border-b border-[#21262d]">
                <h3 class="text-sm font-semibold text-white">Toutes les Positions actives</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-[#21262d] text-[11px] uppercase tracking-wider text-[#8b949e] mono bg-[#090d12]">
                            <th class="py-3 px-6">Nom</th>
                            <th class="py-3 px-4">Ticker</th>
                            <th class="py-3 px-4 text-center">Style</th>
                            <th class="py-3 px-4 text-right">Px Achat</th>
                            <th class="py-3 px-4 text-right">Px Actuel</th>
                            <th class="py-3 px-4 text-right">DCF Cible</th>
                            <th class="py-3 px-4 text-right">Upside</th>
                            <th class="py-3 px-6 text-right">Valeur</th>
                            <th class="py-3 px-4 text-right">Perf Tot.</th>
                            <th class="py-3 px-4 text-right">YTD</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-[#21262d] text-sm mono">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const styleColors = {
            'QUALITY': 'bg-blue-950/40 text-blue-400 border-blue-800/60',
            'GARP': 'bg-emerald-950/40 text-emerald-400 border-emerald-800/60',
            'VALUE': 'bg-amber-950/40 text-amber-400 border-amber-800/60',
            'GROWTH+': 'bg-lime-950/40 text-lime-400 border-lime-800/60',
            'CYCLIC': 'bg-red-950/40 text-red-400 border-red-800/60',
            'DEFENSIVE': 'bg-zinc-800 text-zinc-300 border-zinc-600'
        };

        document.getElementById('last-update').innerText = "MAJ: " + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        fetch('data.json')
            .then(res => {
                if(!res.ok) throw new Error("Fichier data.json introuvable. Il sera créé lors de la prochaine étape.");
                return res.json();
            })
            .then(data => {
                const tbody = document.getElementById('table-body');
                let tickers = [], perfs = [];

                data.forEach(item => {
                    if(!item.ticker) return;
                    tickers.push(item.ticker);
                    perfs.push((item.perf_tot * 100).toFixed(1));

                    let badge = styleColors[item.style] || 'bg-gray-800 text-gray-300 border-gray-600';
                    let cPerf = item.perf_tot >= 0 ? 'text-[#a3e635]' : 'text-[#f85149]';
                    let cYtd = item.ytd >= 0 ? 'text-[#a3e635]' : 'text-[#f85149]';
                    let cUpside = item.upside >= 0 ? 'text-[#a3e635]' : 'text-[#f85149]';

                    tbody.innerHTML += `
                        <tr class="hover:bg-[#1f2937]/30 transition-colors">
                            <td class="py-3 px-6 text-white font-semibold font-sans">${item.name}</td>
                            <td class="py-3 px-4 text-[#8b949e] text-xs">${item.ticker}</td>
                            <td class="py-3 px-4 text-center"><span class="text-[10px] px-2 py-0.5 rounded border ${badge} font-bold">${item.style}</span></td>
                            <td class="py-3 px-4 text-right text-[#8b949e]">${item.px_achat.toFixed(2)}</td>
                            <td class="py-3 px-4 text-right text-white font-medium">${item.px_actuel.toFixed(2)}</td>
                            <td class="py-3 px-4 text-right text-[#8b949e]">${item.dcf_cible ? item.dcf_cible.toFixed(0) : '—'}</td>
                            <td class="py-3 px-4 text-right font-medium ${cUpside}">${item.upside ? (item.upside * 100).toFixed(1) + '%' : '—'}</td>
                            <td class="py-3 px-6 text-right text-white font-semibold">${item.valeur_chf.toLocaleString()}</td>
                            <td class="py-3 px-4 text-right font-bold ${cPerf}">${item.perf_tot >= 0 ? '+' : ''}${(item.perf_tot * 100).toFixed(1)}%</td>
                            <td class="py-3 px-4 text-right font-bold ${cYtd}">${item.ytd >= 0 ? '+' : ''}${(item.ytd * 100).toFixed(1)}%</td>
                        </tr>
                    `;
                });

                var options = {
                    series: [{ name: 'Performance', data: perfs }],
                    chart: { type: 'bar', height: 250, toolbar: {show: false}, background: 'transparent' },
                    plotOptions: { bar: { colors: { ranges: [{ from: -100, to: 0, color: '#f85149' }, { from: 0, to: 1000, color: '#a3e635' }] } } },
                    dataLabels: { enabled: false },
                    theme: { mode: 'dark' },
                    grid: { borderColor: '#21262d' },
                    xaxis: { categories: tickers, labels: { style: { colors: '#8b949e', fontFamily: 'JetBrains Mono' } } },
                    yaxis: { labels: { style: { colors: '#8b949e' } } }
                };
                new ApexCharts(document.querySelector("#perfChart"), options).render();
            })
            .catch(err => {
                document.getElementById('table-body').innerHTML = `<tr><td colspan="10" class="p-6 text-center text-[#8b949e]">${err.message}</td></tr>`;
            });
    </script>
</body>
</html>
